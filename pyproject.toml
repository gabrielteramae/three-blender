[project]
name = "three-blender"
version = "0.1.0"
description = "Converte uma cena estilo Blender em um site interativo."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Teramae" }]
dependencies = []

[project.scripts]
three-blender = "three_blender.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["three_blender*"]
